version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: journal-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: journal_db
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - journal-network

  # Spring Boot Backend
  backend:
    build: ./backend
    container_name: journal-backend
    restart: unless-stopped
    ports:
      - "8000:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=journal_db
      - DB_USER=root
      - DB_PASSWORD=root123
      - JWT_SECRET=YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong2024
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - journal-network

  # Vue.js Frontend
  frontend:
    build: ./frontend
    container_name: journal-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - journal-network

volumes:
  mysql_data:
    driver: local

networks:
  journal-network:
    driver: bridge
